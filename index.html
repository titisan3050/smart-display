<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1222">
<meta name="mobile-web-app-capable" content="yes">
<title>Smart Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* 1920x1200 を基準に、画面サイズに合わせて全体を等倍スケール (1rem = 16px @1920x1200) */
  html { font-size: min(0.8333vw, 1.3333vh); }

  :root {
    --bg-1: #0a1020;
    --bg-2: #16213c;
    --card: rgba(28, 37, 60, 0.72);
    --card-2: rgba(255, 255, 255, 0.045);
    --border: rgba(255, 255, 255, 0.09);
    --text: #f3f6fb;
    --sub: #9aa5bb;
    --dim: #6e7a92;
    --accent: #3aa8f6;
    --green: #34d399;
    --yellow: #fbbf24;
    --red: #f87171;
    --radius: 1.75rem;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    color: var(--text);
    font-family: "Noto Sans JP", system-ui, sans-serif;
    background: radial-gradient(ellipse at 30% 10%, #1d2b4d 0%, var(--bg-2) 35%, var(--bg-1) 100%);
    background-color: var(--bg-1);
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  svg { display: block; }

  /* 背景: 星空 + 山のシルエット */
  #stars { position: fixed; inset: 0; z-index: -2; }
  .mountain { position: fixed; left: 0; bottom: 0; width: 100%; height: 70%; z-index: -1; opacity: .55; }

  .app {
    display: grid;
    grid-template-columns: 46fr 47fr;
    gap: 3.8rem;
    height: 100vh;
    padding: 2.8rem 3.6rem 2.8rem 3.6rem;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 1rem 3rem rgba(0, 0, 0, .25);
  }

  /* ---------- 左カラム ---------- */
  .left { display: flex; flex-direction: column; gap: 1.6rem; min-height: 0; }

  .quote { position: relative; padding: 1.9rem 5rem 1.7rem 2.2rem; }
  .quote-text {
    font-size: 1.6rem; font-weight: 700; font-style: italic; line-height: 1.55;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .quote-author { margin-top: .6rem; text-align: right; color: var(--sub); font-size: 1.3rem; margin-right: -3rem; }
  .quote-refresh {
    position: absolute; top: 1.4rem; right: 1.4rem;
    width: 2.8rem; height: 2.8rem; border-radius: 50%;
    color: var(--dim); display: grid; place-items: center;
  }
  .quote-refresh svg { width: 1.6rem; height: 1.6rem; }
  .quote-refresh:active { background: var(--card-2); }

  .clock-area { position: relative; padding: .4rem 0 0 .2rem; }
  .date { font-size: 2.3rem; font-weight: 300; color: var(--sub); letter-spacing: .03em; }
  .time-row { display: flex; align-items: flex-end; justify-content: space-between; margin-top: -.6rem; }
  .time {
    font-family: "Inter", sans-serif; font-weight: 800;
    font-size: 10.2rem; line-height: 1; letter-spacing: -.045em;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 .3rem 1.5rem rgba(0,0,0,.25);
  }
  .time .sec {
    font-size: 2.6rem; font-weight: 700; letter-spacing: 0;
    color: var(--accent); margin-left: 1rem;
  }
  .status {
    display: flex; align-items: center; gap: 1rem;
    padding: 1rem 1.4rem; margin-bottom: 1.2rem;
    border-radius: 1.1rem;
    background: var(--card); border: 1px solid var(--border);
    font-size: 1.25rem; font-weight: 500;
  }
  .status .item { display: flex; align-items: center; gap: .6rem; }
  .status .sep { width: 1px; height: 1.6rem; background: var(--border); }
  .status svg { width: 1.8rem; height: 1.8rem; }

  /* 天気 */
  .weather { padding: 1.7rem 2rem 1.3rem; }
  .w-top { display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 1.2rem; border-bottom: 1px solid var(--border); }
  .w-now { display: flex; align-items: center; gap: 1.2rem; }
  .w-now .w-icon { width: 5.2rem; height: 5.2rem; }
  .w-title { font-size: 1.75rem; font-weight: 700; }
  .w-sub { font-size: 1.15rem; color: var(--sub); margin-top: .1rem; }
  .w-range { text-align: right; font-size: 1.45rem; font-weight: 500; color: var(--sub); }
  .w-range b { color: var(--text); font-weight: 500; }
  .w-pop { display: flex; justify-content: flex-end; align-items: center; gap: .4rem; margin-top: .3rem; font-size: 1.45rem; color: var(--sub); }
  .w-pop svg { width: 1.3rem; height: 1.3rem; }
  .w-days { display: grid; grid-template-columns: repeat(5, 1fr); padding-top: 1rem; text-align: center; }
  .w-day .d { font-size: 1.2rem; color: var(--sub); }
  .w-day .w-icon { width: 2.8rem; height: 2.8rem; margin: .5rem auto .4rem; }
  .w-day .t { font-size: 1.2rem; font-weight: 700; }
  .w-day .t span { font-weight: 400; color: var(--dim); margin-left: .4rem; }
  .w-msg { color: var(--sub); font-size: 1.2rem; padding: 1rem 0; }
  .weather { cursor: pointer; }
  .w-title .chev { display: inline-block; width: 1.4rem; height: 1.4rem; margin-left: .4rem; vertical-align: -.1rem; color: var(--dim); }

  /* 地域選択 */
  .loc-box { width: 52rem; max-height: 86vh; padding: 2.4rem 2.6rem; position: relative; display: flex; flex-direction: column; gap: 1.4rem; }
  .loc-box h2 { font-size: 1.6rem; font-weight: 700; color: var(--sub); }
  .loc-row { display: flex; gap: .8rem; }
  .loc-input, .loc-select {
    flex: 1; min-width: 0; padding: 1rem 1.2rem; border-radius: 1rem; font-size: 1.35rem; font-family: inherit;
    color: var(--text); background: rgba(0,0,0,.25); border: 1px solid var(--border); outline: none;
  }
  .loc-input:focus, .loc-select:focus { border-color: var(--accent); }
  .loc-select option { background: #1c253c; }
  .loc-btn {
    display: flex; align-items: center; justify-content: center; gap: .6rem;
    padding: 1rem 1.5rem; border-radius: 1rem; font-size: 1.3rem; font-weight: 700;
    background: var(--card-2); border: 1px solid var(--border); white-space: nowrap;
  }
  .loc-btn svg { width: 1.5rem; height: 1.5rem; }
  .loc-btn.primary { background: var(--accent); border-color: var(--accent); color: #06121f; }
  .loc-label { font-size: 1.1rem; color: var(--dim); margin-bottom: -.6rem; }
  .loc-results { list-style: none; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: .6rem; }
  .loc-results button {
    width: 100%; text-align: left; padding: 1rem 1.2rem; border-radius: 1rem;
    background: var(--card-2); border: 1px solid var(--border); font-size: 1.35rem;
  }
  .loc-results button small { color: var(--sub); margin-left: .8rem; font-size: 1.1rem; }
  .loc-status { color: var(--sub); font-size: 1.2rem; }
  .loc-current { font-size: 1.2rem; color: var(--sub); }
  .loc-current b { color: var(--text); }

  /* カテゴリ編集 */
  .feed-list { list-style: none; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: .6rem; }
  .feed-row {
    display: flex; align-items: center; gap: .8rem; padding: .8rem 1rem .8rem 1.3rem;
    background: var(--card-2); border: 1px solid var(--border); border-radius: 1rem;
  }
  .feed-info { flex: 1; min-width: 0; }
  .feed-info b { font-size: 1.4rem; }
  .feed-info small { display: block; color: var(--sub); font-size: 1.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .feed-row .icon-btn { width: 3rem; height: 3rem; }
  .feed-row .icon-btn:disabled { opacity: .3; }
  .feed-row .danger { color: var(--red); }
  .feed-form { display: flex; flex-direction: column; gap: .8rem; }
  .feed-foot { display: flex; justify-content: space-between; align-items: center; }
  .link-btn { color: var(--dim); font-size: 1.15rem; text-decoration: underline; }

  /* ランチャー */
  .launcher {
    flex: 1; min-height: 0;
    display: grid; gap: 1rem; padding: 1.5rem;
    grid-template-columns: repeat(var(--cols, 8), 1fr);
    grid-auto-rows: 1fr;
  }
  .app-btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .7rem;
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: 1.2rem;
    padding: .8rem .3rem;
    transition: transform .12s, background .2s;
    min-height: 0;
  }
  .app-btn:active { transform: scale(.94); background: rgba(255,255,255,.1); }
  .app-btn svg { width: 3rem; height: 3rem; flex-shrink: 0; }
  .app-btn span { font-size: 1.15rem; font-weight: 500; color: #dfe5ef; text-align: center; line-height: 1.25; word-break: break-all; }

  /* ---------- ニュース ---------- */
  .news { display: flex; flex-direction: column; min-height: 0; padding: 2.4rem 1.8rem 1.4rem 2rem; }
  .news-head { display: flex; align-items: center; justify-content: space-between; padding-right: 3.6rem; }
  .news-title { display: flex; align-items: center; gap: .9rem; font-size: 2.2rem; font-weight: 900; }
  .news-title svg { width: 2.3rem; height: 2.3rem; }
  .news-actions { display: flex; align-items: center; gap: .9rem; }
  .icon-btn {
    width: 3.4rem; height: 3.4rem; border-radius: .9rem;
    display: grid; place-items: center;
    background: var(--card-2); border: 1px solid var(--border); color: var(--sub);
  }
  .icon-btn svg { width: 1.6rem; height: 1.6rem; }
  .icon-btn.spin svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .live {
    display: flex; align-items: center; gap: .5rem;
    padding: .5rem 1rem; border-radius: 999px;
    background: var(--card-2); font-size: 1.15rem; color: var(--sub);
  }
  .live i { width: .75rem; height: .75rem; border-radius: 50%; background: var(--green); box-shadow: 0 0 .6rem var(--green); }
  .live.stale i { background: var(--yellow); box-shadow: 0 0 .6rem var(--yellow); }

  .tabs {
    display: flex; align-items: flex-start; gap: 2.2rem; margin-top: 1.4rem; border-bottom: 1px solid var(--border);
    overflow-x: auto; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { white-space: nowrap; flex-shrink: 0; }
  .tab-add {
    flex-shrink: 0; width: 2.6rem; height: 2.6rem; margin-top: .1rem; border-radius: 50%;
    display: grid; place-items: center; color: var(--sub);
    background: var(--card-2); border: 1px solid var(--border);
  }
  .tab-add svg { width: 1.4rem; height: 1.4rem; }
  .tab {
    position: relative; padding: .4rem .1rem 1rem;
    font-size: 1.55rem; font-weight: 700; color: #d5dbe6;
  }
  .tab.active { color: var(--accent); }
  .tab.active::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: .22rem;
    background: var(--accent); border-radius: .2rem;
  }

  .news-list {
    list-style: none; flex: 1; overflow-y: auto; min-height: 0;
    margin-top: 1.2rem; padding-right: .8rem;
    display: flex; flex-direction: column; gap: 1rem;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.18) transparent;
  }
  .news-list::-webkit-scrollbar { width: .35rem; }
  .news-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 1rem; }
  .news-item a {
    display: block; padding: 1.4rem 1.6rem;
    background: var(--card-2); border: 1px solid var(--border); border-radius: 1.2rem;
  }
  .news-item a:active { background: rgba(255,255,255,.09); }
  .n-title {
    font-size: 1.55rem; font-weight: 700; line-height: 1.55;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .n-meta { display: flex; align-items: center; gap: .5rem; margin-top: .6rem; font-size: 1.15rem; color: var(--sub); }
  .n-meta svg { width: 1.15rem; height: 1.15rem; }
  .news-msg { color: var(--sub); font-size: 1.3rem; padding: 2rem .4rem; }

  /* 全画面ボタン */
  .fs-btn {
    position: fixed; top: 1.6rem; right: 1.6rem; z-index: 20;
    width: 3.8rem; height: 3.8rem; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--card); border: 1px solid var(--border); color: #cfd6e2;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .fs-btn svg { width: 1.7rem; height: 1.7rem; }

  /* タイマー */
  .modal {
    position: fixed; inset: 0; z-index: 30; display: none;
    align-items: center; justify-content: center;
    background: rgba(5, 9, 20, .6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .modal.open { display: flex; }
  .timer-box { width: 46rem; padding: 2.6rem 3rem; text-align: center; position: relative; }
  .timer-box h2 { font-size: 1.6rem; font-weight: 700; color: var(--sub); }
  .timer-close { position: absolute; top: 1.4rem; right: 1.4rem; }
  .timer-display {
    font-family: "Inter", sans-serif; font-weight: 800; font-size: 8rem; letter-spacing: -.03em;
    font-variant-numeric: tabular-nums; margin: 1rem 0 1.4rem;
  }
  .timer-display.done { color: var(--yellow); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  .presets { display: flex; flex-wrap: wrap; justify-content: center; gap: .8rem; }
  .presets button, .timer-ctrl button {
    padding: .9rem 1.5rem; border-radius: 1rem; font-size: 1.3rem; font-weight: 700;
    background: var(--card-2); border: 1px solid var(--border);
  }
  .timer-ctrl { display: flex; justify-content: center; gap: 1rem; margin-top: 1.6rem; }
  .timer-ctrl .primary { background: var(--accent); border-color: var(--accent); color: #06121f; min-width: 10rem; }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<svg class="mountain" viewBox="0 0 1920 840" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <linearGradient id="mt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3350"/>
      <stop offset="1" stop-color="#0c1224"/>
    </linearGradient>
  </defs>
  <path fill="url(#mt)" d="M0 520 L260 330 L420 400 L760 120 L1080 430 L1280 360 L1600 560 L1920 470 L1920 840 L0 840 Z"/>
</svg>

<button class="fs-btn" id="fsBtn" aria-label="全画面"></button>

<main class="app">
  <section class="left">
    <div class="card quote">
      <p class="quote-text" id="quoteText"></p>
      <p class="quote-author" id="quoteAuthor"></p>
      <button class="quote-refresh" id="quoteRefresh" aria-label="別の名言"></button>
    </div>

    <div class="clock-area">
      <div class="date" id="date"></div>
      <div class="time-row">
        <div class="time"><span id="hm"></span><span class="sec" id="sec"></span></div>
        <div class="status">
          <div class="item" id="net"></div>
          <div class="sep"></div>
          <div class="item" id="bat"></div>
        </div>
      </div>
    </div>

    <div class="card weather" id="weather"><div class="w-msg">天気を読み込み中…</div></div>

    <nav class="card launcher" id="launcher"></nav>
  </section>

  <section class="card news">
    <div class="news-head">
      <div class="news-title" id="newsTitle"></div>
      <div class="news-actions">
        <button class="icon-btn" id="newsRefresh" aria-label="更新"></button>
        <div class="live" id="live"><i></i>ライブ</div>
      </div>
    </div>
    <div class="tabs" id="tabs"></div>
    <ul class="news-list" id="newsList"></ul>
  </section>
</main>

<div class="modal" id="locModal">
  <div class="card loc-box">
    <h2>地域を選択</h2>
    <button class="icon-btn timer-close" id="locClose" aria-label="閉じる"></button>
    <div class="loc-current" id="locCurrent"></div>
    <button class="loc-btn primary" id="locGeo"></button>
    <div class="loc-label">都道府県から選ぶ</div>
    <select class="loc-select" id="locPref"></select>
    <div class="loc-label">市区町村名で検索</div>
    <form class="loc-row" id="locForm">
      <input class="loc-input" id="locQuery" type="search" placeholder="例: 鎌倉市" enterkeyhint="search">
      <button class="loc-btn" type="submit" id="locSearch"></button>
    </form>
    <div class="loc-status" id="locStatus"></div>
    <ul class="loc-results" id="locResults"></ul>
  </div>
</div>

<div class="modal" id="feedModal">
  <div class="card loc-box">
    <h2>ニュースカテゴリ</h2>
    <button class="icon-btn timer-close" id="feedClose" aria-label="閉じる"></button>
    <ul class="feed-list" id="feedList"></ul>
    <div class="loc-label">カテゴリを追加</div>
    <form class="feed-form" id="feedForm">
      <input class="loc-input" id="feedLabel" placeholder="タブの名前（例: 野球）" maxlength="12">
      <div class="loc-row">
        <input class="loc-input" id="feedKeywords" placeholder="キーワード（スペース区切り。空なら名前で検索）" enterkeyhint="done">
        <button class="loc-btn primary" type="submit" id="feedAddBtn"></button>
      </div>
    </form>
    <div class="feed-foot">
      <span class="loc-status" id="feedStatus"></span>
      <button class="link-btn" id="feedReset" type="button">初期設定に戻す</button>
    </div>
  </div>
</div>

<div class="modal" id="timerModal">
  <div class="card timer-box">
    <h2>タイマー</h2>
    <button class="icon-btn timer-close" id="timerClose" aria-label="閉じる"></button>
    <div class="timer-display" id="timerDisplay">00:00</div>
    <div class="presets" id="presets"></div>
    <div class="timer-ctrl">
      <button id="timerReset">リセット</button>
      <button class="primary" id="timerStart">スタート</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   設定
   ============================================================ */

// 天気の地点の初期値。画面の天気カードをタップすると変更でき、選んだ地点はブラウザに保存される
const DEFAULT_LOCATION = { name: "東京", lat: 35.6895, lon: 139.6917 };

  ["東京都", "東京", 35.6895, 139.6917], ["神奈川県", "横浜市", 35.4333, 139.65], ["新潟県", "新潟市", 37.9226, 139.0412],
  ["富山県", "富山市", 36.7, 137.2167], ["石川県", "金沢市", 36.6, 136.6167], ["福井県", "福井市", 36.0644, 136.2226],
  ["山梨県", "甲府市", 35.6667, 138.5667], ["長野県", "長野市", 36.65, 138.1833], ["岐阜県", "岐阜市", 35.4229, 136.7604],
  ["静岡県", "静岡市", 34.9833, 138.3833], ["愛知県", "名古屋市", 35.1815, 136.9064], ["三重県", "津市", 34.7333, 136.5167],
  ["滋賀県", "大津市", 35.0, 135.8667], ["京都府", "京都市", 35.0211, 135.7538], ["大阪府", "大阪市", 34.6938, 135.5011],
  ["兵庫県", "神戸市", 34.6913, 135.183], ["奈良県", "奈良市", 34.685, 135.8049], ["和歌山県", "和歌山市", 34.2333, 135.1667],

// WMO 天気コード → [アイコン, 表示名]
function wmo(code) {
  if (code === 0) return ["sun", "晴れ"];
  if (code <= 2) return ["partly", "晴れ時々くもり"];
  if (code === 3) return ["cloud", "くもり"];
  if (code <= 48) return ["fog", "霧"];
  if (code <= 57) return ["rain", "霧雨"];
  if (code <= 67) return ["rain", "雨"];
  if (code <= 77) return ["snow", "雪"];
  if (code <= 82) return ["rain", "にわか雨"];
  if (code <= 86) return ["snow", "にわか雪"];
  return ["thunder", "雷雨"];
}

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const WEEK = ["日", "月", "火", "水", "木", "金", "土"];
const esc = s => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function store(key, val) {
  try {
    if (val === undefined) return JSON.parse(localStorage.getItem(key) || "null");
    localStorage.setItem(key, JSON.stringify(val));
  } catch { return null; }
}
async function fetchWithTimeout(url, ms = 12000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try {
    const res = await fetch(url, { signal: ctrl.signal, cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    return res;
  } finally { clearTimeout(timer); }
}

   時計
   ============================================================ */
let lastDay = -1;
function tick() {
  const d = new Date();
  $("hm").textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  $("sec").textContent = pad(d.getSeconds());
  if (d.getDate() !== lastDay) {
    lastDay = d.getDate();
    $("date").textContent = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日(${WEEK[d.getDay()]})`;
    dailyQuote();
  }
  setTimeout(tick, 1000 - d.getMilliseconds());
}

async function initBattery() {
  if (!navigator.getBattery) { $("bat").previousElementSibling.remove(); $("bat").remove(); return; }
  const bat = await navigator.getBattery();
  const render = () => {
    const pct = Math.round(bat.level * 100);
    $("bat").innerHTML = `${battery(pct, bat.charging)}<span>${pct}%</span>`;
  };
  render();
  bat.addEventListener("levelchange", render);
  bat.addEventListener("chargingchange", render);
}

function renderWeather(data) {
  const el = $("weather");
  if (!data) { el.innerHTML = `<div class="w-msg">天気を取得できませんでした</div>`; return; }
  const c = data.current, dd = data.daily;
  const days = dd.time.slice(1, 6).map((t, i) => {
    const d = new Date(t + "T00:00:00");
    return `<div class="w-day"><div class="d">${WEEK[d.getDay()]}</div>${wIcon(dd.weather_code[i + 1])}
      <div class="t">${Math.round(dd.temperature_2m_max[i + 1])}°<span>${Math.round(dd.temperature_2m_min[i + 1])}°</span></div></div>`;
  }).join("");
  el.innerHTML = `
    <div class="w-top">
      <div class="w-now">${wIcon(c.weather_code)}
        <div><div class="w-title">${wmo(c.weather_code)[1]} • ${esc(loc.name)}${ICONS.chevron}</div><div class="w-sub">今日 ${Math.round(c.temperature_2m)}°</div></div>
      </div>
      <div>
        <div class="w-range">最高: <b>${Math.round(dd.temperature_2m_max[0])}°</b> / 最低: <b>${Math.round(dd.temperature_2m_min[0])}°</b></div>
        <div class="w-pop">${ICONS.drop}${dd.precipitation_probability_max[0] ?? "-"}%</div>
      </div>
    </div>
    <div class="w-days">${days}</div>`;
}
// 保存済みの天気は、今の地点と同じ場合だけ使う
function cachedWeather() {
  const w = store("weather");
  return w && w.loc && w.loc.lat === loc.lat && w.loc.lon === loc.lon ? w : null;
}
async function loadWeather() {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}`
    + `&current=temperature_2m,weather_code`
    + `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max`
    + `&timezone=Asia%2FTokyo&forecast_days=6`;
  try {
    const data = await (await fetchWithTimeout(url)).json();
    data.loc = loc;
    store("weather", data);
    renderWeather(data);
  } catch (e) {
    console.warn("weather:", e);
    renderWeather(cachedWeather());
  }
}

/* ============================================================
   地域選択
   ============================================================ */
let loc = store("location") || DEFAULT_LOCATION;

function setLocation(next) {
  loc = next;
  store("location", loc);
  closeLocation();
  $("weather").innerHTML = `<div class="w-msg">天気を読み込み中…</div>`;
  loadWeather();
}
function openLocation() {
  $("locCurrent").innerHTML = `現在の地点: <b>${esc(loc.name)}</b>`;
  $("locStatus").textContent = "";
  $("locResults").innerHTML = "";
  $("locQuery").value = "";
  $("locPref").value = "";
  $("locModal").classList.add("open");
}
function closeLocation() { $("locModal").classList.remove("open"); }

async function searchLocation(q) {
  $("locStatus").textContent = "検索中…";
  $("locResults").innerHTML = "";
  try {
    const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=10&language=ja&format=json`;
    const results = (await (await fetchWithTimeout(url)).json()).results || [];
    $("locStatus").textContent = results.length ? "" : "見つかりませんでした";
    $("locResults").innerHTML = results.map((r, i) => {
      const area = [r.admin1, r.admin2, r.country_code !== "JP" ? r.country : ""].filter(Boolean).join(" ");
      return `<li><button data-i="${i}">${esc(r.name)}<small>${esc(area)}</small></button></li>`;
    }).join("");
    $("locResults").onclick = e => {
      const b = e.target.closest("button"); if (!b) return;
      const r = results[b.dataset.i];
      setLocation({ name: r.name, lat: r.latitude, lon: r.longitude });
    };
  } catch (e) {
    $("locStatus").textContent = "検索に失敗しました";
  }
}

function useGeolocation() {
  if (!navigator.geolocation) { $("locStatus").textContent = "このブラウザは位置情報に対応していません"; return; }
  $("locStatus").textContent = "現在地を取得中…";
  navigator.geolocation.getCurrentPosition(
    p => setLocation({ name: "現在地", lat: +p.coords.latitude.toFixed(4), lon: +p.coords.longitude.toFixed(4) }),
    e => { $("locStatus").textContent = e.code === 1 ? "位置情報の利用が許可されていません" : "現在地を取得できませんでした"; },
    { timeout: 15000, maximumAge: 600000 }
  );
}

function initLocation() {
  $("weather").onclick = openLocation;
  $("locClose").innerHTML = ICONS.close;
  $("locClose").onclick = closeLocation;
  $("locModal").onclick = e => { if (e.target.id === "locModal") closeLocation(); };
  $("locGeo").innerHTML = `${ICONS.pin}<span>現在地を使う</span>`;
  $("locGeo").onclick = useGeolocation;
  $("locSearch").innerHTML = `${ICONS.search}<span>検索</span>`;
  $("locPref").innerHTML = `<option value="">選択してください</option>`
    + PREFS.map((p, i) => `<option value="${i}">${p[0]}（${p[1]}）</option>`).join("");
  $("locPref").onchange = e => {
    if (e.target.value === "") return;
    const [pref, city, lat, lon] = PREFS[e.target.value];
    setLocation({ name: city, lat, lon });
  };
  $("locForm").onsubmit = e => {
    e.preventDefault();
    const q = $("locQuery").value.trim();
    if (q) searchLocation(q);
  };
}

/* ============================================================
   ランチャー
   ============================================================ */
function renderLauncher() {
  const nav = $("launcher");
  // 8個までは1段、それ以上は2段
  nav.style.setProperty("--cols", APPS.length <= 8 ? APPS.length : Math.ceil(APPS.length / 2));
  for (const app of APPS) {
    const el = document.createElement(app.action ? "button" : "a");
    el.className = "app-btn";
    if (app.action === "timer") el.onclick = openTimer;
    else { el.href = app.url; el.target = "_blank"; el.rel = "noopener"; }
    el.innerHTML = `${ICONS[app.icon] || ""}<span>${esc(app.name)}</span>`;
    nav.appendChild(el);
  }
}

/* ============================================================
   ニュース
   ============================================================ */
const newsCache = store("newsCache") || {};
let feeds = store("feeds") || DEFAULT_FEEDS;
let activeKey = feeds[0].key;

function parseRssXml(text) {
  const doc = new DOMParser().parseFromString(text, "text/xml");
  const items = [...doc.querySelectorAll("item")];
  if (!items.length) throw new Error("no items");
  return items.map(it => ({
    title: it.querySelector("title")?.textContent ?? "",
    link: it.querySelector("link")?.textContent ?? "",
    date: new Date(it.querySelector("pubDate")?.textContent ?? "").getTime(),
  }));
}
function parseRss2Json(json) {
  if (json.status !== "ok" || !json.items?.length) throw new Error("rss2json error");
  // rss2json の pubDate は "YYYY-MM-DD HH:mm:ss" (UTC)
  return json.items.map(it => ({ title: it.title, link: it.link, date: new Date(it.pubDate.replace(" ", "T") + "Z").getTime() }));
}
async function fetchFeed(feed) {
  for (const p of PROXIES) {
    try {
      const res = await fetchWithTimeout(p.build(feedUrl(feed)));
      const items = p.type === "json" ? parseRss2Json(await res.json()) : parseRssXml(await res.text());
      return items.sort((a, b) => (b.date || 0) - (a.date || 0)).slice(0, NEWS_MAX);
    } catch (e) { console.warn("proxy failed:", p.build(""), e); }
  }
  throw new Error("all proxies failed");
}
function fmtDate(ms) {
  const d = new Date(ms);
  if (isNaN(d)) return "";
  return `${d.getMonth() + 1}/${d.getDate()}(${WEEK[d.getDay()]}) ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function renderNews() {
  const list = $("newsList");
  const entry = newsCache[activeKey];
  list.scrollTop = 0;
  if (!entry) { list.innerHTML = `<li class="news-msg">読み込み中…</li>`; return; }
  if (!entry.items.length) { list.innerHTML = `<li class="news-msg">ニュースを取得できませんでした</li>`; return; }
  list.innerHTML = entry.items.map(it => `
    <li class="news-item"><a href="${esc(it.link)}" target="_blank" rel="noopener">
      <div class="n-title">${esc(it.title)}</div>
      <div class="n-meta">${ICONS.clock}${fmtDate(it.date)}</div>
    </a></li>`).join("");
}
let loadingNews = false, pendingNews = null;
async function loadNews(targets = feeds) {
  if (!navigator.onLine) return;
  // 読み込み中に呼ばれた分は、終わってから続けて読み込む
  if (loadingNews) { pendingNews = [...new Set([...(pendingNews || []), ...targets])]; return; }
  loadingNews = true;
  $("newsRefresh").classList.add("spin");
  let allOk = true;
  await Promise.all(targets.map(async feed => {
    try {
      newsCache[feed.key] = { items: await fetchFeed(feed), fetchedAt: Date.now() };
    } catch {
      allOk = false;
      if (!newsCache[feed.key]) newsCache[feed.key] = { items: [], fetchedAt: 0 };
    }
  }));
  // 削除済みカテゴリのキャッシュは捨てる
  for (const k of Object.keys(newsCache)) if (!feeds.some(f => f.key === k)) delete newsCache[k];
  store("newsCache", newsCache);
  $("live").classList.toggle("stale", !allOk);
  $("newsRefresh").classList.remove("spin");
  loadingNews = false;
  renderNews();
  if (pendingNews) {
    const next = pendingNews.filter(f => feeds.includes(f));
    pendingNews = null;
    if (next.length) loadNews(next);
  }
}
function setTab(key) {
  activeKey = key;
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.key === key));
  renderNews();
}
let rotateTimer;
function scheduleRotate() {
  clearInterval(rotateTimer);
  if (!TAB_ROTATE_SEC) return;
  rotateTimer = setInterval(() => {
    const i = feeds.findIndex(f => f.key === activeKey);
    setTab(feeds[(i + 1) % feeds.length].key);
  }, TAB_ROTATE_SEC * 1000);
}
function initNews() {
  $("newsTitle").innerHTML = `${ICONS.newspaper}<span>ニュース</span>`;
  $("newsRefresh").innerHTML = ICONS.refresh;
  $("newsRefresh").onclick = () => loadNews();
  renderTabs();
  setTab(activeKey);
  loadNews();
  setInterval(() => loadNews(), NEWS_REFRESH_MIN * 60000);
  scheduleRotate();
  initFeedEditor();
}
function renderTabs() {
  const tabs = $("tabs");
  tabs.innerHTML = "";
  for (const feed of feeds) {
    const b = document.createElement("button");
    b.className = "tab";
    b.dataset.key = feed.key;
    b.textContent = feed.label;
    b.onclick = () => { setTab(feed.key); scheduleRotate(); };
    tabs.appendChild(b);
  }
  const add = document.createElement("button");
  add.className = "tab-add";
  add.setAttribute("aria-label", "カテゴリを編集");
  add.innerHTML = ICONS.plus;
  add.onclick = openFeedEditor;
  tabs.appendChild(add);
  if (!feeds.some(f => f.key === activeKey)) activeKey = feeds[0].key;
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.key === activeKey));
}

/* ---------- カテゴリ編集 ---------- */
function saveFeeds() {
  store("feeds", feeds);
  renderTabs();
  renderFeedList();
}
function renderFeedList() {
  $("feedList").innerHTML = feeds.map((f, i) => `
    <li class="feed-row">
      <div class="feed-info"><b>${esc(f.label)}</b><small>${f.keywords ? esc(f.keywords) : "主要ニュース"}</small></div>
      <button class="icon-btn" data-up="${i}" aria-label="上へ" ${i === 0 ? "disabled" : ""}>${ICONS.up}</button>
      <button class="icon-btn danger" data-del="${i}" aria-label="削除" ${feeds.length <= 1 ? "disabled" : ""}>${ICONS.trash}</button>
    </li>`).join("");
}
function openFeedEditor() {
  renderFeedList();
  $("feedStatus").textContent = "";
  $("feedModal").classList.add("open");
}
function closeFeedEditor() {
  $("feedModal").classList.remove("open");
  setTab(activeKey);
}
function initFeedEditor() {
  $("feedClose").innerHTML = ICONS.close;
  $("feedClose").onclick = closeFeedEditor;
  $("feedModal").onclick = e => { if (e.target.id === "feedModal") closeFeedEditor(); };
  $("feedAddBtn").innerHTML = `${ICONS.plus}<span>追加</span>`;
  $("feedList").onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.del !== undefined) {
      feeds = feeds.filter((_, i) => i !== +b.dataset.del);
    } else if (b.dataset.up !== undefined) {
      const i = +b.dataset.up;
      feeds = [...feeds];
      [feeds[i - 1], feeds[i]] = [feeds[i], feeds[i - 1]];
    }
    saveFeeds();
  };
  $("feedForm").onsubmit = e => {
    e.preventDefault();
    const label = $("feedLabel").value.trim();
    if (!label) { $("feedStatus").textContent = "名前を入力してください"; return; }
    const keywords = $("feedKeywords").value.trim() || label;
    const feed = { key: "c" + Date.now().toString(36), label, keywords };
    feeds = [...feeds, feed];
    activeKey = feed.key;
    saveFeeds();
    $("feedLabel").value = ""; $("feedKeywords").value = "";
    $("feedStatus").textContent = `「${label}」を追加しました`;
    loadNews([feed]);
  };
  $("feedReset").onclick = () => {
    if (!confirm("カテゴリを初期設定に戻しますか？")) return;
    feeds = DEFAULT_FEEDS;
    try { localStorage.removeItem("feeds"); } catch {}
    renderTabs(); renderFeedList();
    loadNews();
  };
}

/* ============================================================
   タイマー
   ============================================================ */
let timerTotal = 0, timerLeft = 0, timerEnd = 0, timerId = null, beepId = null, audioCtx = null;
const PRESETS = [1, 3, 5, 10, 15, 30];
function fmtTimer(s) {
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return h ? `${h}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
}
function renderTimer() {
  $("timerDisplay").textContent = fmtTimer(Math.max(0, Math.ceil(timerLeft)));
  $("timerStart").textContent = timerId ? "一時停止" : "スタート";
}
function beep() {
  try {
    audioCtx = audioCtx || new AudioContext();
    [0, .25, .5].forEach(t => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(.25, audioCtx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + t + .2);
      o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + .2);
    });
  } catch {}
}
function stopAlarm() {
  clearInterval(beepId); beepId = null;
  $("timerDisplay").classList.remove("done");
}
function timerTick() {
  timerLeft = (timerEnd - Date.now()) / 1000;
  if (timerLeft <= 0) {
    clearInterval(timerId); timerId = null; timerLeft = 0;
    $("timerDisplay").classList.add("done");
    $("timerModal").classList.add("open");
    beep(); beepId = setInterval(beep, 1500);
    setTimeout(stopAlarm, 60000);
  }
  renderTimer();
}
function openTimer() { $("timerModal").classList.add("open"); renderTimer(); }
function initTimer() {
  $("timerClose").innerHTML = ICONS.close;
  $("timerClose").onclick = () => { stopAlarm(); $("timerModal").classList.remove("open"); };
  $("presets").innerHTML = PRESETS.map(m => `<button data-m="${m}">+${m}分</button>`).join("");
  $("presets").onclick = e => {
    const m = e.target.dataset.m; if (!m) return;
    stopAlarm();
    timerLeft += m * 60; timerTotal = timerLeft;
    if (timerId) timerEnd += m * 60000;
    renderTimer();
  };
  $("timerStart").onclick = () => {
    stopAlarm();
    audioCtx = audioCtx || new AudioContext();   // ユーザー操作時に音声を有効化
    if (timerId) { clearInterval(timerId); timerId = null; }
    else if (timerLeft > 0) { timerEnd = Date.now() + timerLeft * 1000; timerId = setInterval(timerTick, 250); }
    renderTimer();
  };
  $("timerReset").onclick = () => {
    stopAlarm(); clearInterval(timerId); timerId = null; timerLeft = 0; renderTimer();
  };
}

/* ============================================================
   全画面 / スリープ防止 / 背景
   ============================================================ */
let wakeLock = null;
async function requestWakeLock() {
  try {
    if ("wakeLock" in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    }
  } catch (e) { console.warn("wakeLock:", e); }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { requestWakeLock(); loadNews(); }
});
document.addEventListener("pointerdown", requestWakeLock, { once: true });

function renderFsIcon() { $("fsBtn").innerHTML = document.fullscreenElement ? ICONS.shrink : ICONS.expand; }
$("fsBtn").onclick = async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen({ navigationUI: "hide" });
  } catch (e) { console.warn("fullscreen:", e); }
  requestWakeLock();
};
document.addEventListener("fullscreenchange", renderFsIcon);

function drawStars() {
  const c = $("stars"), dpr = window.devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  c.style.width = innerWidth + "px"; c.style.height = innerHeight + "px";
  const ctx = c.getContext("2d");
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const n = Math.floor(innerWidth * innerHeight / 2500);
  for (let i = 0; i < n; i++) {
    const x = rnd() * c.width, y = rnd() * c.height * .8, r = (rnd() * 1.1 + .2) * dpr;
    ctx.fillStyle = `rgba(255,255,255,${rnd() * .6 + .15})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
}
window.addEventListener("resize", drawStars);

/* ============================================================
   起動
   ============================================================ */
drawStars();
renderFsIcon();
tick();
renderNet();
initBattery();
initLocation();
if (cachedWeather()) renderWeather(cachedWeather());
loadWeather();
setInterval(loadWeather, WEATHER_REFRESH_MIN * 60000);
renderLauncher();
initNews();
initTimer();
requestWakeLock();
</script>
